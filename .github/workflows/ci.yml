name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline
        run: pip install --quiet "./pipeline[dev]"

      - name: Unit tests
        run: pytest pipeline/tests -q

      - name: Byte-compile everything
        run: python -m compileall -q pipeline/src

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version comes from package.json's packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Valuation parity vs Python golden
        run: pnpm --filter @pcps/valuation test

      - name: Build web app
        run: pnpm --filter @pcps/web build

      - name: Typecheck
        # after build: next build generates next-env.d.ts, which tsc needs
        run: pnpm -r typecheck
