[project]
name = "pcpartscan"
version = "0.2.0"
description = "Harvest, price and grade GovDeals bulk-computer auctions"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pypdf>=4.0",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcps = "pcpartscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcpartscan"]
